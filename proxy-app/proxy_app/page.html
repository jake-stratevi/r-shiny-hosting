<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
$refresh
<title>$title</title>
<style>
  :root { color-scheme: light; }
  body {
    font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: #f7f8fa; color: #1c2230; margin: 0;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px;
  }
  .card {
    background: #fff; border: 1px solid #e2e6ee; border-radius: 10px;
    padding: 40px 48px; max-width: 560px; width: 100%;
    box-shadow: 0 1px 3px rgba(20,30,60,.06);
  }
  h1 { font-size: 19px; margin: 0 0 14px; font-weight: 600; }
  p { font-size: 14px; line-height: 1.6; color: #55607a; margin: 0 0 12px; }
  code {
    background: #f1f3f8; padding: 2px 6px; border-radius: 4px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px; color: #1c2230; word-break: break-all;
  }
  .bar {
    height: 3px; border-radius: 3px; background: #e6eaf3;
    overflow: hidden; margin: 4px 0 20px;
  }
  .bar span {
    display: block; height: 100%; width: 35%; border-radius: 3px;
    background: #3b6ce4; animation: slide 1.6s ease-in-out infinite;
  }
  @keyframes slide {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(300%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .bar span { animation: none; width: 100%; opacity: .35; }
  }
  .foot {
    margin: 24px 0 0; padding-top: 16px; border-top: 1px solid #eef1f6;
    font-size: 12px; color: #8a93a8;
  }
</style>
</head>
<body>
  <main class="card">
    <h1>$heading</h1>
    $bar
    $paragraphs
    $mono
    <p class="foot">Stratevi</p>
  </main>
</body>
</html>
